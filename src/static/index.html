<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Agentic RAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0e14;
      --bg-panel: #10151d;
      --bg-input: #0d1117;
      --border: #1f2733;
      --border-strong: #2c3846;
      --text: #dde4ee;
      --text-dim: #8592a3;
      --text-faint: #4c5868;
      --accent: #3fb950;
      --accent-dim: #2ea043;
      --accent-ink: #062b12;
      --alert: #ff7b72;
      --font-sans: "Inter", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(900px 500px at 50% -10%, rgba(63, 185, 80, 0.07), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    main { width: 100%; max-width: 1100px; }

    .terminal {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.6);
      animation: rise 0.5s ease-out;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .terminal-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: #0d1219;
      border-bottom: 1px solid var(--border);
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-red { background: #ff5f57; }
    .dot-yellow { background: #febc2e; }
    .dot-green { background: #28c840; }

    .terminal-path {
      margin-left: 6px;
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--text-faint);
    }

    .terminal-body { padding: 32px 28px 28px; }
    .intro { margin-bottom: 28px; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }

    .query-panel { min-width: 0; }

    .prompt-line {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-dim);
      margin: 0 0 14px;
    }

    .prompt-line .prompt { color: var(--accent); margin-right: 8px; }

    h1 {
      margin: 0 0 10px;
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .muted {
      color: var(--text-dim);
      font-size: 0.95rem;
      line-height: 1.55;
      max-width: 52ch;
      margin: 0;
    }

    form { display: grid; gap: 18px; }
    .field { display: grid; gap: 8px; }

    label {
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--text-faint);
    }

    .input-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 12px 14px;
      transition: border-color 0.15s ease;
    }

    .input-row:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(63, 185, 80, 0.15);
    }

    .prefix {
      font-family: var(--font-mono);
      color: var(--accent);
      line-height: 1.5;
      user-select: none;
    }

    input, textarea {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      padding: 0;
      resize: none;
    }

    input:focus, textarea:focus { outline: none; }
    textarea { min-height: 96px; line-height: 1.5; }
    input::placeholder, textarea::placeholder { color: var(--text-faint); }

    button {
      justify-self: start;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      padding: 12px 22px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent-ink);
      background: var(--accent);
      transition: background 0.15s ease, transform 0.1s ease;
    }

    button:hover:not(:disabled) { background: var(--accent-dim); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { cursor: wait; opacity: 0.55; }

    :is(input, textarea, button):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #status {
      min-height: 20px;
      margin-top: 22px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 2px;
    }

    #status.is-error { color: var(--alert); }

    #status .cursor {
      display: inline-block;
      width: 7px;
      height: 14px;
      margin-left: 2px;
      background: var(--accent);
      animation: blink 1s steps(1) infinite;
    }

    #status.is-error .cursor { background: var(--alert); }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    #answer {
      display: none;
      margin-top: 0;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      min-width: 0;
      max-height: 520px;
      overflow-y: auto;
    }

    #answer .answer-head {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-faint);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }

    #answer .sources-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: #0d1219;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11.5px;
    }

    .sources-label {
      color: var(--accent);
      font-weight: 600;
      margin-right: 4px;
    }

    .source-pill {
      background: rgba(63, 185, 80, 0.12);
      border: 1px solid rgba(63, 185, 80, 0.3);
      color: var(--text);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    #answer .answer-body {
      padding: 20px;
      line-height: 1.65;
      font-size: 0.95rem;
    }

    #answer .answer-body h1,
    #answer .answer-body h2,
    #answer .answer-body h3 {
      color: #fff;
      margin-top: 1.2em;
      margin-bottom: 0.5em;
      font-weight: 600;
    }

    #answer .answer-body p {
      margin: 0.7em 0;
    }

    #answer .answer-body ul,
    #answer .answer-body ol {
      padding-left: 24px;
      margin: 0.7em 0;
    }

    #answer .answer-body li {
      margin: 4px 0;
    }

    #answer .answer-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
      font-size: 0.9rem;
    }

    #answer .answer-body th,
    #answer .answer-body td {
      border: 1px solid var(--border-strong);
      padding: 8px 12px;
      text-align: left;
    }

    #answer .answer-body th {
      background: #161b22;
      color: var(--text);
    }

    #answer .answer-body code:not(pre code) {
      font-family: var(--font-mono);
      font-size: 0.85em;
      background: #161b22;
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      color: #7ee787;
    }

    #answer .answer-body pre {
      position: relative;
      background: #0d1117;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 14px;
      overflow-x: auto;
      margin: 1em 0;
    }

    #answer .answer-body pre code {
      font-family: var(--font-mono);
      font-size: 0.88rem;
      line-height: 1.5;
      background: transparent;
      padding: 0;
      border: 0;
    }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 8px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease, background 0.15s ease;
    }

    #answer .answer-body pre:hover .copy-btn {
      opacity: 1;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: var(--text);
    }

    @media (max-width: 480px) {
      .terminal-body { padding: 24px 18px 20px; }
      h1 { font-size: 1.4rem; }
      button { width: 100%; justify-self: stretch; text-align: center; }
    }

    @media (max-width: 760px) {
      .workspace { grid-template-columns: 1fr; }
      #answer { grid-row: 2; }
    }

    @media (prefers-reduced-motion: reduce) {
      .terminal { animation: none; }
      #status .cursor { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main>
    <div class="terminal">
      <div class="terminal-bar">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
        <span class="terminal-path">agentic-rag — github query</span>
      </div>
      <div class="terminal-body">
        <div class="intro">
          <p class="prompt-line"><span class="prompt">$</span>whoami</p>
          <h1>GitHub Agentic RAG</h1>
          <p class="muted">Ask a question about any GitHub repository. The agent reads the code and calls live GitHub data to answer.</p>
        </div>
        <div class="workspace">
          <section id="answer" aria-live="polite">
            <div class="answer-head">output</div>
            <div id="sources-container" class="sources-bar" style="display: none;"></div>
            <div class="answer-body"></div>
          </section>
          <div class="query-panel">
            <form id="chat-form">
              <div class="field">
                <label for="repository">repository</label>
                <div class="input-row">
                  <span class="prefix">›</span>
                  <input id="repository" required placeholder="owner/repository or full URL">
                </div>
              </div>
              <div class="field">
                <label for="question">question</label>
                <div class="input-row">
                  <span class="prefix">?</span>
                  <textarea id="question" required placeholder="How does authentication work?"></textarea>
                </div>
              </div>
              <button id="submit" type="submit">Ask repository</button>
            </form>
            <div id="status" role="status"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script>
    const form = document.querySelector("#chat-form");
    const button = document.querySelector("#submit");
    const status = document.querySelector("#status");
    const answer = document.querySelector("#answer");
    const answerBody = answer.querySelector(".answer-body");

    const loadingMessages = [
      "Reading repository context",
      "Fetching files from GitHub",
      "Calling GitHub tools",
      "Generating answer"
    ];

    let loadingTimer = null;

    function setStatus(text, { error = false, showCursor = false } = {}) {
      status.classList.toggle("is-error", error);
      status.innerHTML = "";
      status.append(document.createTextNode(text));
      if (showCursor) {
        const cursor = document.createElement("span");
        cursor.className = "cursor";
        status.append(cursor);
      }
    }

    function startLoading() {
      let i = 0;
      setStatus(loadingMessages[0], { showCursor: true });
      loadingTimer = setInterval(() => {
        i = (i + 1) % loadingMessages.length;
        setStatus(loadingMessages[i], { showCursor: true });
      }, 1400);
    }

    function stopLoading() {
      clearInterval(loadingTimer);
      loadingTimer = null;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      answer.style.display = "none";
      startLoading();
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            repository_url: document.querySelector("#repository").value,
            question: document.querySelector("#question").value
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "The request failed.");

        // Render sources
        const sourcesContainer = document.querySelector("#sources-container");
        sourcesContainer.innerHTML = "";
        if (data.sources && data.sources.length > 0) {
          const label = document.createElement("span");
          label.className = "sources-label";
          label.textContent = "Evidence:";
          sourcesContainer.appendChild(label);

          data.sources.forEach(src => {
            const pill = document.createElement("span");
            pill.className = "source-pill";
            pill.textContent = src;
            sourcesContainer.appendChild(pill);
          });
          sourcesContainer.style.display = "flex";
        } else {
          sourcesContainer.style.display = "none";
        }

        // Render Markdown answer
        answerBody.innerHTML = marked.parse(data.answer || "No answer was returned.");

        // Add copy buttons to code blocks
        answerBody.querySelectorAll("pre").forEach(pre => {
          const copyBtn = document.createElement("button");
          copyBtn.type = "button";
          copyBtn.className = "copy-btn";
          copyBtn.textContent = "Copy";
          copyBtn.addEventListener("click", () => {
            const code = pre.querySelector("code") ? pre.querySelector("code").innerText : pre.innerText;
            navigator.clipboard.writeText(code).then(() => {
              copyBtn.textContent = "Copied!";
              setTimeout(() => { copyBtn.textContent = "Copy"; }, 2000);
            });
          });
          pre.appendChild(copyBtn);
        });

        answer.style.display = "block";
        setStatus(data.selected_tool ? `Used GitHub tool: ${data.selected_tool}` : "Answer ready.");
      } catch (error) {
        setStatus(`Error: ${error.message}`, { error: true });
      } finally {
        stopLoading();
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
